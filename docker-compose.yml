services:
  ts-backend-template:
    build: .
    container_name: ts-backend-template-api
    mem_limit: 512m
    mem_reservation: 128m
    restart: unless-stopped
    env_file: .env
    environment:
      # Konteyner içinden compose ağındaki servislere bağlan (.env'i ezer).
      REDIS_URL: "redis://redis:6379"
      # DB host'u compose ağında "postgres" servis adıdır.
      # ⚠️ CLOUD/MANAGED Postgres kullanacaksan: bu satırı SİL (böylece .env'deki
      #    bulut DATABASE_URL kullanılır) ve aşağıdaki "postgres" servisini kaldır.
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4009:3000"
    healthcheck:
      # Uygulamanın "/" healthcheck endpoint'i (server.ts). node:alpine'da curl
      # yok; global fetch'li node ile bağımlılıksız kontrol. start_period,
      # migrate deploy + boot süresine tolerans tanır.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        "max-size": "10m"
        "max-file": "3"

  # ⚠️ CLOUD/MANAGED Postgres kullanacaksan bu servis GEREKSİZDİR: kaldır veya
  #    `docker compose stop postgres` ile durdur (bkz. .env.example).
  postgres:
    image: postgres:16-alpine
    container_name: ts-backend-template-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Host'tan (npm run dev / psql) erişim için. Çakışırsa sol tarafı değiştir.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ts-backend-template-redis
    restart: unless-stopped
    # Oturumlar Redis'te yaşıyor: AOF ile kalıcılık + canlı oturumları asla
    # evict etmeyen politika (bkz. ADR 0001).
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    ports:
      # Host'tan (npm run dev) erişim için. Çakışırsa sol tarafı değiştir.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  postgres-data:
