# Yalnızca testler için izole Postgres + Redis. Üretim/dev servislerinden
# farklı portlarda çalışır ve veriyi tmpfs'te tutar (kalıcı değil, hızlı).
#   npm run test:db:up    -> ayağa kaldır (healthcheck'leri bekler)
#   npm run test:db:down  -> kapat ve volume'leri temizle
# Ana compose'dan ayrı bir proje adı: "orphan containers" uyarısını önler.
name: backend-template-test

services:
  test-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test_db
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test_db"]
      interval: 2s
      timeout: 3s
      retries: 30

  test-redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
